# ---------------------------------------------------------------------------
# Catalogo de vidrios del iterador, agrupado por tipo (asi se muestra en la GUI).
#
# Campos: nombre (texto que se escribe en la ficha), u [W/m2K], fs (factor
# solar g, va a la columna E 'FS Vidrio' de la ficha), tl (transmision luminosa
# %, informativa), ficha (abreviatura de una fila DE FABRICA de la ficha 01).
#   - Con 'ficha': se usa esa fila tal cual; no se escribe nada en el catalogo.
#   - Sin 'ficha': es un vidrio propio; se escribe en '3. Tablas Envolvente'
#     fila 32 (B nombre, C abreviatura = nombre, D U, E FS).
# El nombre no debe estar contenido en otro nombre de la ficha (la seleccion de
# paquetes busca el nombre dentro de las opciones de Texto_Vidrios).
#
# Fuentes:
#   (ficha)      filas de fabrica de la ficha 01 v2.2, '3. Tablas Envolvente' 27-31.
#   (fabricante) tablas entregadas por Lucas (2026-11): Vidrio float monolitico;
#                Termopanel 6 Planitherm #2 / aire 12 / 6 float incoloro;
#                Termopanel 6 Planistar Sun #2 / aire 12 / 6 float incoloro.
#   Se usa el factor solar g del fabricante. Ojo: la tabla dice CS 0,1 para el
#   incoloro 5 mm (errata evidente); no afecta porque se usa g = 0,87.
#   Argon: misma g que con aire (la tabla da una sola g).
# ---------------------------------------------------------------------------
grupos:
  "Monolíticos":
    MONOLITICO_6:   {nombre: "Vidrio Monolítico (VM). Sin espaciador", u: 5.8, fs: 0.87, ficha: "VM"}
