# U12:V357), en su mismo orden. Se escriben tal cual en CEV-CEVE!E8 y E9.
#   Ojo: "Isla\u00a0\u00a0de Pascua" y "Pedro\u00a0Aguirre Cerda" llevan espacios
#   duros (U+00A0) en la ficha; aqui van escapados igual.
